{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}تشخیص هوشمند عیوب سطحی{% endblock %}</title>
  
  <!-- فونت‌ها -->
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  
  <style>
    /* --- متغیرهای اصلی تم --- */
    :root {
      --bg-base: #030305;
      --bg-panel: rgba(20, 20, 25, 0.6);
      --text-main: #f8f9fa;
      --text-muted: #9ca3af;
      --primary: #ff003c;
      --primary-glow: rgba(255, 0, 60, 0.4);
      --primary-hover: #e60036;
      --border-light: rgba(255, 255, 255, 0.08);
      --border-glow: rgba(255, 0, 60, 0.3);
      --radius: 16px;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* --- ریست و پایه --- */
    * { box-sizing: border-box; }
    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      font-family: 'Vazirmatn', sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      /* افکت نور پس زمینه */
      background-image: 
        radial-gradient(circle at 15% 50%, rgba(255, 0, 60, 0.05), transparent 25%),
        radial-gradient(circle at 85% 30%, rgba(255, 0, 60, 0.03), transparent 25%);
      background-attachment: fixed;
      overflow-x: hidden;
    }
    
    ::selection { background: var(--primary); color: #fff; }
    a { text-decoration: none; color: inherit; }
    
    .container { max-width: 1200px; margin: 0 auto; padding: 0 24px; width: 100%; }

    /* --- هدر شیشه‌ای --- */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(3, 3, 5, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-light);
      transition: var(--transition);
    }
    .nav-inner { display: flex; justify-content: space-between; align-items: center; height: 80px; }
    
    .brand {
      font-size: 22px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 12px;
      letter-spacing: -0.5px;
    }
    .brand-icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, var(--primary), #7a0022);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 15px var(--primary-glow);
      transform: rotate(45deg);
    }
    .brand-icon i { transform: rotate(-45deg); font-size: 16px; color: white; }

    .nav-links { display: flex; align-items: center; gap: 32px; }
    .nav-links a:not(.btn) {
      color: var(--text-muted);
      font-size: 15px;
      font-weight: 500;
      transition: var(--transition);
      position: relative;
    }
    .nav-links a:not(.btn):hover { color: var(--text-main); }
    .nav-links a:not(.btn)::after {
      content: '';
      position: absolute;
      bottom: -6px; left: 0; right: 0;
      height: 2px; background: var(--primary);
      transform: scaleX(0); transition: var(--transition);
      transform-origin: right;
    }
    .nav-links a:not(.btn):hover::after { transform: scaleX(1); transform-origin: left; }

    /* --- دکمه‌های مدرن --- */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 28px;
      border-radius: 50px;
      font-weight: 700;
      font-size: 15px;
      transition: var(--transition);
      cursor: pointer;
      border: none;
      font-family: inherit;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--primary), #b3002a);
      color: #fff;
      box-shadow: 0 4px 20px var(--primary-glow);
    }
    .btn-primary:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(255, 0, 60, 0.6);
    }
    .btn-outline {
      background: transparent;
      color: var(--text-main);
      border: 1px solid var(--border-light);
    }
    .btn-outline:hover {
      border-color: var(--primary);
      background: rgba(255, 0, 60, 0.05);
      color: var(--primary);
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
    .btn-lg { padding: 16px 40px; font-size: 17px; }

    /* --- محتوای اصلی --- */
    main { flex: 1; display: flex; flex-direction: column; }

    /* --- فوتر --- */
    .footer {
      border-top: 1px solid var(--border-light);
      padding: 40px 0;
      text-align: center;
      color: var(--text-muted);
      font-size: 14px;
      margin-top: auto;
      background: rgba(10, 10, 12, 0.5);
    }
    .footer p { margin: 0; }

    /* --- انیمیشن‌های عمومی --- */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-up { animation: fadeInUp 0.6s ease-out forwards; }

    @media (max-width: 900px) {
      .nav-inner { flex-direction: column; height: auto; padding: 20px 0; gap: 20px; }
      .nav-links { gap: 15px; flex-wrap: wrap; justify-content: center; }
    }
  </style>
  
  {% block extra_css %}{% endblock %}
</head>
<body>

  <!-- هدر -->
  <header class="navbar">
    <div class="container nav-inner">
      <a href="/" class="brand">
        <div class="brand-icon"><i class="bi bi-cpu"></i></div>
        AI Surface
      </a>
      <nav class="nav-links">
        <a href="/#features">قابلیت‌ها</a>
        <a href="/#industries">صنایع</a>
        <a href="/#how">نحوه کار</a>
        <a class="btn btn-primary" href="/test/">
          <i class="bi bi-magic"></i> آزمایش تصویر
        </a>
      </nav>
    </div>
  </header>

  <!-- محتوا -->
  <main>
    {% block content %}{% endblock %}
  </main>

  <!-- فوتر -->
  <footer class="footer">
    <div class="container">
      <p>© ۲۰۲۴ سامانه تشخیص هوشمند عیوب سطحی — قدرت گرفته از هوش مصنوعی</p>
    </div>
  </footer>

  {% block extra_js %}{% endblock %}
</body>
</html>
